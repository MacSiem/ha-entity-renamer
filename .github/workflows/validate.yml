name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install planner test dependencies
        run: python -m pip install PyYAML==6.0.3 Jinja2==3.1.6
      - name: Backend planning, persistence and transaction regressions
        run: python -B -m unittest discover -s tests -p 'test*.py' -v
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax (node --check)
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail
      - name: Theming invariant (no OS prefers-color-scheme)
        run: |
          if grep -rln "@media (prefers-color-scheme" --include='*.js' .; then
            echo "FAIL: OS prefers-color-scheme present — cards must follow HA theme via :host(.bento-dark) luminance"
            exit 1
          fi
          echo "OK: no OS prefers-color-scheme"
      - name: A11y invariant (focus-visible present in cards)
        run: |
          miss=0
          for f in $(git ls-files '*.js' | grep -vE 'editor|\.min\.'); do
            if grep -q 'customElements.define' "$f" && grep -q ':host' "$f"; then
              grep -q ':focus-visible' "$f" || { echo "WARN: no :focus-visible in $f"; }
            fi
          done
          echo "a11y check done"
      - name: Install test dependencies
        run: npm ci
      - name: Runtime and HTML security regressions
        run: |
          node --test tests/*.test.cjs
          node .github/smoke.cjs
